name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_unit_assemble:
    name: Lint + Unit + Assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: jdx/mise-action@v4
        with:
          cache: true
          cache_key_prefix: 'mise-v1'

      - uses: gradle/actions/setup-gradle@v6

      - name: Run lint, unit tests, and assemble
        run: mise x java -- ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Prepare CI APK names
        run: |
          mkdir -p app/build/outputs/ci-apk
          cp app/build/outputs/renamed-apk/debug/mafza-*-debug.apk app/build/outputs/ci-apk/mafza-debug.apk
          cp app/build/outputs/renamed-apk/release/mafza-*-release.apk app/build/outputs/ci-apk/mafza-release.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mafza-apk-artifacts
          path: |
            app/build/outputs/ci-apk/mafza-debug.apk
            app/build/outputs/ci-apk/mafza-release.apk
          if-no-files-found: error

  instrumentation:
    name: Instrumentation (AVD)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: lint_unit_assemble

    steps:
      - uses: actions/checkout@v6

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: jdx/mise-action@v4
        with:
          cache: true
          cache_key_prefix: 'mise-v1'

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mise x java -- ./gradlew :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.yshalsager.mafza.emergency.EmergencyTriggerSurfacesTest,com.yshalsager.mafza.emergency.steps.ActionStepsDeviceTest,com.yshalsager.mafza.profile.ProfileUiFlowTest

  validate_fastlane_metadata:
    name: Validate Fastlane Metadata
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ashutoshgngwr/validate-fastlane-supply-metadata@v2
        with:
          fastlaneDir: ./fastlane/metadata/android
          usePlayStoreLocales: false
