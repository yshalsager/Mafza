name: Release

on:
  workflow_dispatch:
    inputs:
      create_tag:
        description: 'Create and push a release tag'
        required: true
        default: false
        type: boolean
      dry_run:
        description: 'Dry run (skip GitHub Release publishing)'
        required: true
        default: true
        type: boolean
      release:
        description: 'Bump version from last tag and create a release'
        required: true
        default: false
        type: boolean
      bump:
        description: 'Semver bump type (used when release=true)'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: 'Optional explicit version (e.g. 0.2.0). Overrides bump calculation when set.'
        required: false
        type: string
      skip_screenshots:
        description: 'Skip screenshot refresh workflow'
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*.*.*'

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      checkout_ref: ${{ steps.checkout_ref.outputs.ref }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: jdx/mise-action@v4
        with:
          cache: true
          cache_key_prefix: 'mise-v1'

      - name: Compute version
        id: v
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ inputs.release }}" != 'true' ]]; then
            VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*\"([^\"]+)\".*$/\1/p' app/build.gradle.kts | head -n 1)"
            if [[ -z "$VERSION" ]]; then
              echo 'versionName not found in app/build.gradle.kts'
              exit 1
            fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_TAG=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n 1 || true)
          if [[ -z "$LAST_TAG" ]]; then
            BASE='0.1.0'
          else
            BASE="${LAST_TAG#v}"
          fi

          IFS='.' read -r major minor patch <<<"$BASE"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          VERSION="$major.$minor.$patch"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump version files (manual release)
        if: ${{ inputs.release && inputs.create_tag && github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}
        env:
          VERSION: ${{ steps.v.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mise x ruby -- ruby -e '
            file = "app/build.gradle.kts"
            content = File.read(file)
            match = content.match(/versionCode\s*=\s*(\d+)/) or abort("versionCode not found in #{file}")
            next_code = match[1].to_i + 1
            content.sub!(/versionCode\s*=\s*\d+/, "versionCode = #{next_code}")
            content.sub!(/versionName\s*=\s*"[^"]+"/, %(versionName = "#{ENV.fetch("VERSION")}"))
            File.write(file, content)
            puts "versionName=#{ENV.fetch("VERSION")} versionCode=#{next_code}"
          '

      - name: Commit + tag (manual release)
        if: ${{ inputs.release && inputs.create_tag && github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}
        env:
          TAG: ${{ steps.v.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "Release $TAG"

      - name: Push changes (manual release)
        if: ${{ inputs.release && inputs.create_tag && github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          set -euo pipefail
          git push
          git push --tags

      - name: Create and push release tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_tag && !inputs.release }}
        shell: bash
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Decide checkout ref
        id: checkout_ref
        shell: bash
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          ref="$GITHUB_REF"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ref="$GITHUB_REF"
          elif [[ "${{ inputs.create_tag }}" == 'true' ]]; then
            ref="refs/tags/$TAG"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  screenshots_refresh:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_screenshots }}
    uses: ./.github/workflows/screenshots.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      create_pr: ${{ github.event_name == 'workflow_dispatch' }}
      base_ref: ${{ github.ref_name }}

  build:
    needs: [version, screenshots_refresh]
    if: ${{ always() && needs.version.result == 'success' && (needs.screenshots_refresh.result == 'success' || needs.screenshots_refresh.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.version.outputs.checkout_ref }}

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: jdx/mise-action@v4
        with:
          cache: true
          cache_key_prefix: 'mise-v1'

      - uses: gradle/actions/setup-gradle@v6

      - name: Validate release signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || { echo "Missing secret: ANDROID_KEYSTORE_BASE64"; exit 1; }
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || { echo "Missing secret: ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          [[ -n "$ANDROID_KEY_ALIAS" ]] || { echo "Missing secret: ANDROID_KEY_ALIAS"; exit 1; }
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || { echo "Missing secret: ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build artifacts
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: mise x java -- ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease

      - name: Collect artifacts
        id: artifacts
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-out

          debug_apk=$(find app/build/outputs/renamed-apk/debug -type f -name 'mafza-*-debug.apk' | head -n 1 || true)
          release_apk=$(find app/build/outputs/renamed-apk/release -type f -name 'mafza-*-release.apk' | head -n 1 || true)
          release_aab=$(find app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1 || true)

          if [[ -z "$debug_apk" || -z "$release_apk" || -z "$release_aab" ]]; then
            echo 'Missing one or more release artifacts'
            exit 1
          fi

          out_debug="release-out/mafza-v${VERSION}-debug.apk"
          out_release="release-out/mafza-v${VERSION}-release.apk"
          out_aab="release-out/mafza-v${VERSION}-release.aab"

          cp "$debug_apk" "$out_debug"
          cp "$release_apk" "$out_release"
          cp "$release_aab" "$out_aab"

          echo "apk_debug=$out_debug" >> "$GITHUB_OUTPUT"
          echo "apk_release=$out_release" >> "$GITHUB_OUTPUT"
          echo "aab_release=$out_aab" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            ${{ steps.artifacts.outputs.apk_debug }}
            ${{ steps.artifacts.outputs.apk_release }}
            ${{ steps.artifacts.outputs.aab_release }}
          if-no-files-found: error

      - name: Create GitHub release
        if: ${{ (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_tag)) && !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: |
            ${{ steps.artifacts.outputs.apk_debug }}
            ${{ steps.artifacts.outputs.apk_release }}
            ${{ steps.artifacts.outputs.aab_release }}
