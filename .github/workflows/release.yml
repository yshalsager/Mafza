name: Release

on:
  workflow_dispatch:
    inputs:
      create_tag:
        description: 'Create and push a release tag from current versionName'
        required: true
        default: false
        type: boolean
      dry_run:
        description: 'Dry run (skip GitHub Release publishing)'
        required: true
        default: true
        type: boolean
      skip_screenshots:
        description: 'Skip screenshot refresh workflow'
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*.*.*'

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      checkout_ref: ${{ steps.checkout_ref.outputs.ref }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: jdx/mise-action@v4
        with:
          cache: true
          cache_key_prefix: 'mise-v1'

      - name: Compute version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#v}"
          else
            version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' app/build.gradle.kts | head -n 1)"
            if [[ -z "$version" ]]; then
              echo 'versionName not found in app/build.gradle.kts'
              exit 1
            fi
            tag="v${version}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_tag }}
        shell: bash
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Decide checkout ref
        id: checkout_ref
        shell: bash
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          ref="$GITHUB_REF"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ref="$GITHUB_REF"
          elif [[ "${{ inputs.create_tag }}" == 'true' ]]; then
            ref="refs/tags/$TAG"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  screenshots_refresh:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_screenshots }}
    uses: ./.github/workflows/screenshots.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      create_pr: ${{ github.event_name == 'workflow_dispatch' }}
      base_ref: ${{ github.ref_name }}

  build:
    needs: [version, screenshots_refresh]
    if: ${{ always() && needs.version.result == 'success' && (needs.screenshots_refresh.result == 'success' || needs.screenshots_refresh.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.version.outputs.checkout_ref }}

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: jdx/mise-action@v4
        with:
          cache: true
          cache_key_prefix: 'mise-v1'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build artifacts
        run: mise x java -- ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease

      - name: Collect artifacts
        id: artifacts
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-out

          debug_apk=$(find app/build/outputs/renamed-apk/debug -type f -name 'mafza-*-debug.apk' | head -n 1 || true)
          release_apk=$(find app/build/outputs/renamed-apk/release -type f -name 'mafza-*-release.apk' | head -n 1 || true)
          release_aab=$(find app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1 || true)

          if [[ -z "$debug_apk" || -z "$release_apk" || -z "$release_aab" ]]; then
            echo 'Missing one or more release artifacts'
            exit 1
          fi

          out_debug="release-out/mafza-v${VERSION}-debug.apk"
          out_release="release-out/mafza-v${VERSION}-release.apk"
          out_aab="release-out/mafza-v${VERSION}-release.aab"

          cp "$debug_apk" "$out_debug"
          cp "$release_apk" "$out_release"
          cp "$release_aab" "$out_aab"

          echo "apk_debug=$out_debug" >> "$GITHUB_OUTPUT"
          echo "apk_release=$out_release" >> "$GITHUB_OUTPUT"
          echo "aab_release=$out_aab" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            ${{ steps.artifacts.outputs.apk_debug }}
            ${{ steps.artifacts.outputs.apk_release }}
            ${{ steps.artifacts.outputs.aab_release }}
          if-no-files-found: error

      - name: Create GitHub release
        if: ${{ (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_tag)) && !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: |
            ${{ steps.artifacts.outputs.apk_debug }}
            ${{ steps.artifacts.outputs.apk_release }}
            ${{ steps.artifacts.outputs.aab_release }}
