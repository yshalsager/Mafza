name: Android CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_unit_assemble:
    name: Lint + Unit + Assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run lint, unit tests, and assemble
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mafza-apk-artifacts
          path: |
            app/build/outputs/renamed-apk/debug/*.apk
            app/build/outputs/renamed-apk/release/*.apk
          if-no-files-found: error

  instrumentation:
    name: Instrumentation (AVD)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: lint_unit_assemble

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run connected instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.yshalsager.mafza.emergency.EmergencyTriggerSurfacesTest,com.yshalsager.mafza.emergency.steps.ActionStepsDeviceTest,com.yshalsager.mafza.profile.ProfileUiFlowTest
